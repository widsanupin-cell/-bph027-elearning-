    background-size:cover; background-position:center; background-attachment:fixed;
    font-family:'Sarabun',sans-serif; color:#242820; padding:20px;
  }
  .card{
    background:rgba(255,253,246,0.96); border-radius:12px; max-width:440px; width:100%;
    padding:36px 32px 30px; box-shadow:0 24px 60px rgba(0,0,0,0.4); text-align:center;
    backdrop-filter:blur(3px);
  }
  .seal{
    width:48px;height:48px;border-radius:50%; margin:0 auto 14px;
    border:1.5px solid var(--gold); color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Taviraj',serif;font-weight:600;font-size:18px;
  }
  h1{font-family:'Taviraj',serif; font-size:24px; color:var(--teal); margin:0 0 4px;}
  .course-name{font-size:14.5px; color:#565B4E; margin-bottom:22px;}
  .week-status{
    border-radius:8px; padding:14px 16px; margin-bottom:22px; font-size:14.5px; line-height:1.6;
  }
  .week-status.open{background:var(--green-ok-soft); color:#1D3B27;}
  .week-status.closed{background:var(--brick-soft); color:#4E1D14;}
  .week-status b{display:block; font-family:'Taviraj',serif; font-size:17px; margin-bottom:2px;}
  .field{margin-bottom:16px; text-align:right;}
  .field label{font-size:13px; color:#565B4E; display:block; margin-bottom:6px;}
  .field input{
    width:100%; padding:11px 14px; border:1px solid var(--rule); border-radius:6px;
    font-family:'Sarabun',sans-serif; font-size:15.5px; background:#fff; color:#242820;
  }
  .field input:focus{outline:2px solid var(--teal-soft); outline-offset:1px;}
  .checkin-btn{
    width:100%; margin-top:8px; background:var(--teal); color:#F4EFE0; border:none;
    border-radius:6px; padding:13px 18px; font-family:'Sarabun',sans-serif; font-weight:600;
    font-size:16px; cursor:pointer;
  }
  .checkin-btn:hover:not(:disabled){background:var(--teal-soft);}
  .checkin-btn:disabled{opacity:.6; cursor:not-allowed;}
  .result-msg{margin-top:16px; padding:12px 14px; border-radius:6px; font-size:14.5px; display:none; line-height:1.6;}
  .result-msg.show{display:block;}
  .result-msg.success{background:var(--green-ok-soft); color:#1D3B27;}
  .result-msg.error{background:var(--brick-soft); color:#4E1D14;}
  .field-error{color:var(--brick); font-size:13px; margin:6px 0 0; display:none;}
  .field-error.show{display:block;}

  .popup-overlay{
    position:fixed; inset:0; z-index:9999;
    background:rgba(14,51,45,0.85);
    display:none; align-items:center; justify-content:center; padding:20px;
    opacity:0; transition:opacity .25s ease;
  }
  .popup-overlay.show{display:flex;}
  .popup-overlay.visible{opacity:1;}
  .popup-card{
    background:#FFFDF6; border-radius:14px; max-width:360px; width:100%;
    padding:28px 26px 26px; text-align:center;
    box-shadow:0 30px 70px rgba(0,0,0,0.4);
    transform:scale(.9); transition:transform .25s ease;
  }
  .popup-overlay.visible .popup-card{transform:scale(1);}
  .popup-photo{width:180px; margin:0 auto 12px; display:block;}
  .popup-title{font-family:'Taviraj',serif; font-size:22px; color:var(--teal); margin:0 0 6px;}
  .popup-sub{font-size:14.5px; color:#565B4E; margin:0 0 20px; line-height:1.6;}
  .popup-like-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:none; border:1.5px solid var(--rule); border-radius:30px;
    padding:9px 22px; font-family:'Sarabun',sans-serif; font-size:14.5px; color:#565B4E;
    cursor:pointer; transition:.15s ease;
  }
  .popup-like-btn .heart{font-size:17px; transition:transform .15s ease;}
  .popup-like-btn.liked{background:var(--brick-soft); border-color:var(--brick); color:var(--brick);}
  .popup-like-btn.liked .heart{transform:scale(1.2);}
  .popup-close-btn{
    display:block; margin:14px auto 0; background:none; border:none;
    color:#8E9C89; font-size:13px; cursor:pointer; text-decoration:underline;
  }
</style>
</head>
<body>

<div class="card">
  <div class="seal">ผสส</div>
  <h1>เช็คชื่อเข้าเรียน</h1>
  <div class="course-name" id="courseName">วิทยาลัยนครราชสีมา</div>

  <div class="week-status" id="weekStatus">กำลังตรวจสอบสัปดาห์ที่เปิดให้เช็คชื่อ...</div>

    <label>ชื่อ-สกุล</label>
    <input type="text" id="ciName" placeholder="เช่น นายสมชาย ใจดี" autocomplete="name">
  </div>
  <div class="field">
    <label>รหัสนักศึกษา</label>
    <input type="text" id="ciId" placeholder="เช่น 6512345678" autocomplete="off">
  </div>
  <div class="field-error" id="ciError"></div>

  <button class="checkin-btn" id="ciBtn">เช็คชื่อ</button>

  <div class="result-msg" id="ciResult"></div>
</div>

    <div class="popup-title">ลงชื่อสำเร็จ ✓</div>
    <p class="popup-sub">ขอให้มีความสุขกับการเรียนในรายวิชานี้นะครับ</p>
    <button class="popup-like-btn" id="popupLikeBtn"><span class="heart">🤍</span><span id="likeText">ถูกใจ</span></button>
    <button class="popup-close-btn" id="popupCloseBtn">ปิดหน้าต่างนี้</button>
  </div>
</div>

<script>
// ============ ตั้งค่าที่ต้องแก้ก่อนใช้งานจริง ============
const CONTROL_SHEET_ID = "1Uk44zV6lOnRAuyJAgwhuWNBexOTPir-mIGAE0twXGTA"; // รหัสชีต (ระหว่าง /d/ กับ /edit ในลิงก์ชีต)
const CONTROL_TAB_GID = "1415243322"; // gid ของแท็บ "ควบคุมเช็คชื่อ" (ดูจากลิงก์ตอนเปิดแท็บนั้น หลัง #gid=)
const ATTENDANCE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMRoPrT5tqZc-YOjCJXqefrbjaf1dIxKt6fsCIWv7TR72CaLYAjrtnHlzH6ZN7EkKpzg/exec"; // ลิงก์ Web App จาก Apps Script
const COURSE_LABEL = "BPH027 กฎหมายและจรรยาบรรณวิชาชีพสาธารณสุข ภาคสมทบ"; // แก้เป็นชื่อวิชา/กลุ่มเรียนที่ต้องการแสดง

document.getElementById('courseName').textContent = COURSE_LABEL;

let currentOpenWeek = null;

async function loadCurrentWeek(){
  const statusEl = document.getElementById('weekStatus');
  try {
    const url = 'https://docs.google.com/spreadsheets/d/' + CONTROL_SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + CONTROL_TAB_GID;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = text.trim().split(/\r?\n/).map(r => r.split(',').map(c => c.trim().replace(/^"|"$/g,'').replace(/\r/g,'')));
    let openWeek = null;
    rows.slice(1).forEach(row => {
      const wk = (row[0] || '').trim().replace(/\r/g,'');
      const status = (row[1] || '').trim().replace(/\r/g,'');
      if (status === 'เปิด' && !openWeek) openWeek = wk;
    });
    currentOpenWeek = openWeek;
    if (openWeek) {
      statusEl.className = 'week-status open';
      statusEl.innerHTML = '<b>สัปดาห์ที่ ' + openWeek + '</b>กำลังเปิดให้เช็คชื่ออยู่ในขณะนี้';
    } else {
      statusEl.className = 'week-status closed';
      statusEl.innerHTML = '<b>ยังไม่เปิดให้เช็คชื่อ</b>กรุณารออาจารย์เปิดระบบก่อน';
    }
  } catch (e) {
    statusEl.className = 'week-status closed';
    statusEl.innerHTML = '<b>ไม่สามารถโหลดสถานะได้</b>กรุณาลองรีเฟรชหน้านี้อีกครั้ง';
  }
}
loadCurrentWeek();

document.getElementById('ciBtn').addEventListener('click', async () => {
  const name = document.getElementById('ciName').value.trim();
  const id = document.getElementById('ciId').value.trim();
  const errEl = document.getElementById('ciError');
  const resultEl = document.getElementById('ciResult');
  const btn = document.getElementById('ciBtn');

  errEl.classList.remove('show');
  resultEl.classList.remove('show', 'success', 'error');

  if (!name || !id) {
    errEl.textContent = 'กรุณากรอกชื่อ-สกุล และรหัสนักศึกษาให้ครบถ้วน';
    errEl.classList.add('show');
    return;
  }
  if (!currentOpenWeek) {
    errEl.textContent = 'ยังไม่มีสัปดาห์ใดเปิดให้เช็คชื่อในขณะนี้';
    errEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก...';

  try {
    const params = new URLSearchParams({ action: 'checkin', name, studentId: id, week: currentOpenWeek });
    const res = await fetch(ATTENDANCE_SCRIPT_URL + '?' + params.toString());
    const data = await res.json();

    if (data.status === 'success') {
      resultEl.classList.add('show', 'success');
      resultEl.innerHTML = '<b>เช็คชื่อสำเร็จ ✓</b><br>สัปดาห์ที่ ' + data.week + ' — ' + name;
      showSuccessPopup();
    } else if (data.status === 'already_checked_in') {
      resultEl.classList.add('show', 'success');
      resultEl.innerHTML = '<b>ท่านเช็คชื่อสัปดาห์นี้ไปแล้ว ✓</b><br>ไม่ต้องเช็คซ้ำอีกครั้ง';
    } else if (data.status === 'no_open_week') {
      resultEl.classList.add('show', 'error');
      resultEl.innerHTML = 'ยังไม่มีสัปดาห์ใดเปิดให้เช็คชื่อในขณะนี้';
    } else {
      resultEl.classList.add('show', 'error');
      resultEl.innerHTML = 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
    }
  } catch (e) {
    resultEl.classList.add('show', 'error');
    resultEl.innerHTML = 'เชื่อมต่อไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่';
  }

  btn.disabled = false;
  btn.textContent = 'เช็คชื่อ';
});

function showSuccessPopup(){
  const popup = document.getElementById('successPopup');
  popup.classList.add('show');
  requestAnimationFrame(() => popup.classList.add('visible'));
}
function hideSuccessPopup(){
  const popup = document.getElementById('successPopup');
  popup.classList.remove('visible');
  setTimeout(() => popup.classList.remove('show'), 250);
}
document.getElementById('popupCloseBtn').addEventListener('click', hideSuccessPopup);
document.getElementById('successPopup').addEventListener('click', (e) => {
  if (e.target.id === 'successPopup') hideSuccessPopup();
});
document.getElementById('popupLikeBtn').addEventListener('click', function(){
  const liked = this.classList.toggle('liked');
  this.querySelector('.heart').textContent = liked ? '❤️' : '🤍';
  document.getElementById('likeText').textContent = liked ? 'ถูกใจแล้ว' : 'ถูกใจ';
});
</script>
</body>
</html>
